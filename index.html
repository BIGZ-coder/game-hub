<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGZ ARCADE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b16;
  color:white;
}
header{
  padding:25px;
  background:linear-gradient(135deg,#171d45,#35145c);
  text-align:center;
}
h1{font-size:42px;margin:5px}
.subtitle{color:#b9c1df}
button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  margin:5px;
  background:#5865f2;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#737df5}
#games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:18px;
  max-width:1000px;
  margin:30px auto;
  padding:20px;
}
.card{
  background:#181e35;
  padding:25px;
  border-radius:18px;
  text-align:center;
  cursor:pointer;
  border:1px solid #30385c;
}
.card:hover{
  transform:translateY(-5px);
  border-color:#7c75ff;
}
.icon{font-size:50px}
#gameScreen{
  display:none;
  max-width:900px;
  margin:25px auto;
  padding:20px;
  text-align:center;
}
canvas{
  background:#111;
  border:3px solid #555;
  border-radius:12px;
  max-width:100%;
}
#score{
  font-size:22px;
  margin:10px;
}
</style>
</head>

<body>

<header>
<h1>🎮 BIGZ ARCADE</h1>
<div class="subtitle">Play games directly on the site</div>

<button onclick="home()">🏠 HOME</button>
<button onclick="startSnake()">🐍 SNAKE</button>
<button onclick="startDodge()">🚗 DODGE</button>
<button onclick="startBasket()">🏀 BASKETBALL</button>
</header>


<div id="games">

<div class="card" onclick="startSnake()">
<div class="icon">🐍</div>
<h2>Snake</h2>
<p>Eat the dots and get the highest score.</p>
</div>

<div class="card" onclick="startDodge()">
<div class="icon">🚗</div>
<h2>Traffic Dodge</h2>
<p>Dodge the cars and survive.</p>
</div>

<div class="card" onclick="startBasket()">
<div class="icon">🏀</div>
<h2>Basketball</h2>
<p>Click to shoot and score.</p>
</div>

<div class="card" onclick="startRunner()">
<div class="icon">🏃</div>
<h2>Runner</h2>
<p>Jump over obstacles.</p>
</div>

</div>


<div id="gameScreen">

<button onclick="home()">⬅ BACK</button>

<div id="score">Score: 0</div>

<canvas id="canvas" width="700" height="450"></canvas>

<div>
<button onclick="restartGame()">🔄 Restart</button>
</div>

</div>


<script>

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");
let game="";
let score=0;
let interval;


/* HOME */

function home(){
 clearInterval(interval);
 document.getElementById("games").style.display="grid";
 document.getElementById("gameScreen").style.display="none";
}


/* GAME SCREEN */

function screen(){
 document.getElementById("games").style.display="none";
 document.getElementById("gameScreen").style.display="block";
}


/* ================= SNAKE ================= */

let snake;
let food;
let dx;
let dy;

function startSnake(){

screen();

game="snake";

snake=[
{x:10,y:10},
{x:9,y:10},
{x:8,y:10}
];

dx=1;
dy=0;

score=0;

food={
x:Math.floor(Math.random()*34),
y:Math.floor(Math.random()*21)
};

clearInterval(interval);

interval=setInterval(snakeGame,120);

}

function snakeGame(){

ctx.fillStyle="#111";
ctx.fillRect(0,0,700,450);

let head={
x:snake[0].x+dx,
y:snake[0].y+dy
};

if(
head.x<0||
head.x>=35||
head.y<0||
head.y>=22
){

startSnake();
return;

}

snake.unshift(head);

if(head.x===food.x && head.y===food.y){

score++;

food={
x:Math.floor(Math.random()*34),
y:Math.floor(Math.random()*21)
};

}else{

snake.pop();

}

ctx.fillStyle="#55e878";

snake.forEach(s=>{
ctx.fillRect(s.x*20,s.y*20,18,18);
});

ctx.fillStyle="#ff5555";
ctx.fillRect(food.x*20,food.y*20,18,18);

document.getElementById("score").innerText="Score: "+score;

}

document.addEventListener("keydown",e=>{

if(game!=="snake")return;

if(e.key==="ArrowUp" && dy!==1){
dx=0;dy=-1;
}

if(e.key==="ArrowDown" && dy!==-1){
dx=0;dy=1;
}

if(e.key==="ArrowLeft" && dx!==1){
dx=-1;dy=0;
}

if(e.key==="ArrowRight" && dx!==-1){
dx=1;dy=0;
}

});


/* ================= DODGE ================= */

let player;
let cars=[];

function startDodge(){

screen();

game="dodge";

player={
x:330,
y:390,
w:40,
h:40
};

cars=[];

score=0;

clearInterval(interval);

interval=setInterval(dodgeGame,30);

}

function dodgeGame(){

ctx.fillStyle="#202020";
ctx.fillRect(0,0,700,450);

ctx.fillStyle="#444";

for(let x=100;x<700;x+=150){
ctx.fillRect(x,0,8,450);
}

if(keys["ArrowLeft"]){
player.x-=7;
}

if(keys["ArrowRight"]){
player.x+=7;
}

player.x=Math.max(0,Math.min(660,player.x));

if(Math.random()<0.025){

cars.push({
x:Math.random()*660,
y:-50,
w:40,
h:50,
speed:4+Math.random()*4
});

}

cars.forEach(c=>{

c.y+=c.speed;

ctx.fillStyle="#e74c3c";
ctx.fillRect(c.x,c.y,c.w,c.h);

});

cars=cars.filter(c=>c.y<500);

ctx.fillStyle="#3da5ff";
ctx.fillRect(player.x,player.y,player.w,player.h);

for(let c of cars){

if(
player.x<c.x+c.w &&
player.x+player.w>c.x &&
player.y<c.y+c.h &&
player.y+player.h>c.y
){

startDodge();
return;

}

}

score++;

document.getElementById("score").innerText=
"Score: "+Math.floor(score/10);

}

let keys={};

document.addEventListener("keydown",e=>{
keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
keys[e.key]=false;
});


/* ================= BASKETBALL ================= */

let ball;

function startBasket(){

screen();

game="basket";

score=0;

ball={
x:350,
y:390
};

clearInterval(interval);

interval=setInterval(basketGame,30);

}

function basketGame(){

ctx.fillStyle="#c97b38";
ctx.fillRect(0,0,700,450);

ctx.fillStyle="white";
ctx.fillRect(0,400,700,5);

ctx.strokeStyle="white";
ctx.lineWidth=5;

ctx.strokeRect(300,60,100,80);

ctx.beginPath();
ctx.arc(350,140,35,0,Math.PI*2);
ctx.stroke();

ctx.fillStyle="#ff8c00";

ctx.beginPath();
ctx.arc(ball.x,ball.y,18,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="white";
ctx.font="22px Arial";
ctx.fillText("Click the ball to shoot!",220,430);

document.getElementById("score").innerText=
"Score: "+score;

}

canvas.addEventListener("click",function(e){

if(game!=="basket")return;

let rect=canvas.getBoundingClientRect();

let x=e.clientX-rect.left;
let y=e.clientY-rect.top;

let distance=Math.sqrt(
(x-ball.x)**2+(y-ball.y)**2
);

if(distance<40){

if(ball.y<180){

score++;

}

ball.x=350;
ball.y=390;

}

});


/* ================= RUNNER ================= */

let runner;
let obstacles=[];

function startRunner(){

screen();

game="runner";

runner={
x:80,
y:350,
vy:0,
ground:true
};

obstacles=[];

score=0;

clearInterval(interval);

interval=setInterval(runnerGame,30);

}

function runnerGame(){

ctx.fillStyle="#18233b";
ctx.fillRect(0,0,700,450);

ctx.fillStyle="#4caf50";
ctx.fillRect(0,400,700,50);

runner.vy+=0.7;
runner.y+=runner.vy;

if(runner.y>=350){

runner.y=350;
runner.vy=0;
runner.ground=true;

}

if(Math.random()<0.025){

obstacles.push({
x:700,
y:360,
w:35,
h:40
});

}

obstacles.forEach(o=>{
o.x-=6;
});

obstacles=obstacles.filter(o=>o.x>-50);

ctx.fillStyle="#4da6ff";
ctx.fillRect(runner.x,runner.y,40,50);

ctx.fillStyle="#ff5555";

obstacles.forEach(o=>{
ctx.fillRect(o.x,o.y,o.w,o.h);
});

for(let o of obstacles){

if(
runner.x<o.x+o.w &&
runner.x+40>o.x &&
runner.y<o.y+o.h &&
runner.y+50>o.y
){

startRunner();
return;

}

}

score++;

document.getElementById("score").innerText=
"Score: "+Math.floor(score/10);

}

document.addEventListener("keydown",e=>{

if(game==="runner" &&
(e.key===" " || e.key==="ArrowUp") &&
runner.ground){

runner.vy=-13;
runner.ground=false;

}

});


/* RESTART */

function restartGame(){

if(game==="snake")startSnake();
if(game==="dodge")startDodge();
if(game==="basket")startBasket();
if(game==="runner")startRunner();

}

</script>

</body>
</html>
